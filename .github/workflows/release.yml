name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches version files
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NODE_VER=$(node -p "require('./package.json').version")
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG package.json=$NODE_VER tauri.conf=$CONF_VER Cargo.toml=$CARGO_VER"
          if [ "$TAG" != "$NODE_VER" ] || [ "$TAG" != "$CONF_VER" ] || [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Version mismatch — tag v$TAG does not match package.json ($NODE_VER), tauri.conf.json ($CONF_VER) and/or Cargo.toml ($CARGO_VER)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CyberClock ${{ github.ref_name }}'
          releaseBody: |
            Release ${{ github.ref_name }}

            Download the installer below. Installed copies with auto-updates enabled will receive this version automatically.
          releaseDraft: false
          prerelease: false

      - name: Generate checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.sig" -o -name "latest.json" \) -exec sha256sum {} \; > checksums.sha256
          cat checksums.sha256

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/checksums.sha256
