name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches version files
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NODE_VER=$(node -p "require('./package.json').version")
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG package.json=$NODE_VER tauri.conf=$CONF_VER Cargo.toml=$CARGO_VER"
          if [ "$TAG" != "$NODE_VER" ] || [ "$TAG" != "$CONF_VER" ] || [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Version mismatch — tag v$TAG does not match package.json ($NODE_VER), tauri.conf.json ($CONF_VER) and/or Cargo.toml ($CARGO_VER)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Draft release: the tauri-action builds the NSIS installer, signs the
      # updater artifacts (.sig + latest.json, required by the app's updater
      # endpoint), and creates the GitHub release as a DRAFT. The template
      # render below replaces the body; publishing stays a manual step.
      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CyberClock ${{ github.ref_name }}'
          releaseBody: 'Release ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

      - name: Render release notes from template
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER_NUM="${TAG#v}"
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::NSIS installer not found under src-tauri/target/release/bundle/nsis"
            exit 1
          fi
          INSTALLER_HASH=$(sha256sum "$INSTALLER" | cut -d' ' -f1)
          echo "installer: $INSTALLER"
          echo "sha256:   $INSTALLER_HASH"

          # Render .github/release-template.md with the release facts
          sed -e "s/{{VERSION}}/$TAG/g" \
              -e "s/{{VERSION_NUM}}/$VER_NUM/g" \
              -e "s/{{INSTALLER_HASH}}/$INSTALLER_HASH/g" \
              .github/release-template.md > FINAL_RELEASE_NOTES.md

          # Update the draft release body in place (keeps draft state)
          gh release edit "$TAG" --notes-file FINAL_RELEASE_NOTES.md

      - name: Generate checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.sig" -o -name "latest.json" \) -exec sha256sum {} \; > checksums.sha256
          cat checksums.sha256

      # Keep the release a DRAFT: without make_draft this step publishes
      # the release automatically once assets upload. Publishing remains a
      # deliberate manual step for the maintainer.
      - name: Upload checksums to release (keep draft)
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/checksums.sha256
          make_draft: true

      # Final guard: some action in the chain above has been observed to
      # flip the draft to published. Re-assert the draft state through the
      # API so the release always lands as a draft, no matter what.
      - name: Force draft state (final guard)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release for $TAG not found"
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f draft=true
          echo "Release $TAG (id $RELEASE_ID) forced back to draft."
