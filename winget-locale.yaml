Description: A feature-rich desktop clock with a futuristic cyber-neon aesthetic. CyberClock combines an analog and digital clock, full calendar, timer, stopwatch, alarms, and independent floating widgets, plus an optional talking clock that announces the time and reads alarms aloud. Relax lets you save named mixes of recorded soundscapes and control the session from its widget, and automatic backups keep your alarms, notes and preferences safe in a folder you choose. Built with Tauri.
