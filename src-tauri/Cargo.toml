[package]
name = "app"
version = "1.4.0"
description = "CyberClock - Premium Cyber-Neon Clock"
authors = ["CyberGems"]
license = ""
repository = "https://github.com/CyberGems/CyberClock"
edition = "2021"
rust-version = "1.77.2"

# Explicit bin target so dev builds and process lists show
# cyberclock.exe instead of the package-default app.exe. The bundler
# already renames to CyberClock.exe (mainBinaryName in tauri.conf.json).
[[bin]]
name = "cyberclock"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Work-area query for the tray menu placement (keeps it clear of the
# taskbar). Already present in the dependency tree via Tauri's plugins;
# this only narrows the enabled feature set for direct use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
