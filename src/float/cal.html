<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="../favicon.ico" />
        <title>CyberClock Calendar</title>
        <link rel="stylesheet" href="../shared/themes.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <script src="../shared/tauri-bridge.js"></script>
        <script src="../shared/tint.js"></script>
        <script src="../shared/i18n.js"></script>
        <script src="../shared/icons.js"></script>
        <link rel="stylesheet" href="cal.css" />
    </head>
    <body data-tint="ice">
        <div class="float-cal-shell" id="cal-shell">
            <div class="cal-hdr" id="cal-hdr">
                <div class="cal-nav-group no-drag">
                    <button class="cal-btn" id="btn-cal-prev" data-tooltip="Previous month" data-i18n-attr="data-tooltip:float.prevMonth" data-tooltip-dir="bottom" data-tooltip-align="left">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="cal-btn" id="btn-cal-today" data-tooltip="Today" data-i18n-attr="data-tooltip:float.today" data-tooltip-dir="bottom">
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor">
                            <circle cx="12" cy="12" r="5"></circle>
                        </svg>
                    </button>
                    <button class="cal-btn" id="btn-cal-next" data-tooltip="Next month" data-i18n-attr="data-tooltip:float.nextMonth" data-tooltip-dir="bottom">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="cal-title no-drag" id="cal-title" role="button" tabindex="0" data-tooltip="Select month or year" data-i18n-attr="data-tooltip:float.pickMonthYear" data-tooltip-dir="bottom">agosto 2026</div>
                <div class="cal-win-ctl no-drag">
                    <button class="cal-btn" id="btn-cal-menu" data-tooltip="Menu and settings" data-i18n-attr="data-tooltip:float.menuTooltip" data-tooltip-dir="left">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="1.5"></circle>
                            <circle cx="12" cy="5" r="1.5"></circle>
                            <circle cx="12" cy="19" r="1.5"></circle>
                        </svg>
                    </button>
                    <button class="cal-btn btn-close" id="btn-cal-close" data-tooltip="Close" data-i18n-attr="data-tooltip:float.close" data-tooltip-dir="bottom" data-tooltip-align="right">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="cal-weekdays" id="cal-weekdays">
                <span>lun.</span>
                <span>mar.</span>
                <span>mié.</span>
                <span>jue.</span>
                <span>vie.</span>
                <span class="cal-we">sáb.</span>
                <span class="cal-we">dom.</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>

            <!-- Quick Month & Year Picker Popover -->
            <div class="cal-picker-popover" id="cal-picker-popover" hidden>
                <div class="picker-year-row">
                    <button class="picker-btn" id="btn-picker-prev-year" data-tooltip="Previous year" data-i18n-attr="data-tooltip:float.prevYear, aria-label:float.prevYear" data-tooltip-dir="bottom" data-tooltip-align="left">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="11 17 6 12 11 7"></polyline>
                            <polyline points="18 17 13 12 18 7"></polyline>
                        </svg>
                    </button>
                    <span class="picker-year-label" id="picker-year-val">2026</span>
                    <button class="picker-btn" id="btn-picker-next-year" data-tooltip="Next year" data-i18n-attr="data-tooltip:float.nextYear, aria-label:float.nextYear" data-tooltip-dir="bottom" data-tooltip-align="right">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="13 17 18 12 13 7"></polyline>
                            <polyline points="6 17 11 12 6 7"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="picker-months-grid" id="picker-months-grid"></div>
            </div>

        </div>
        <script src="cal.js"></script>
    </body>
</html>
