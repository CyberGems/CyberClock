<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="../favicon.ico" />
        <title>CyberClock Analog</title>
        <link rel="stylesheet" href="../shared/themes.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <script src="../shared/tauri-bridge.js"></script>
        <script src="../shared/tint.js"></script>
        <script src="../shared/i18n.js"></script>
        <script src="../shared/icons.js"></script>
        <script src="../shared/analog-engine.js"></script>
        <link rel="stylesheet" href="analog.css" />
    </head>
    <body data-tint="ice">
        <div class="float-analog-shell" id="analog-shell">
            <canvas id="analog-canvas" width="266" height="266"></canvas>

            <!-- Quick Controls overlay (Reveals smoothly on hover) -->
            <div class="analog-overlay" id="analog-overlay">
                <button class="analog-ov-btn btn-menu" id="btn-analog-menu" data-tooltip="Menu and settings" data-i18n-attr="data-tooltip:float.menuTooltip" data-tooltip-dir="bottom" data-tooltip-align="left">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1.5"></circle>
                        <circle cx="12" cy="5" r="1.5"></circle>
                        <circle cx="12" cy="19" r="1.5"></circle>
                    </svg>
                </button>
                <button class="analog-ov-btn btn-close" id="btn-analog-close" data-tooltip="Close" data-i18n-attr="data-tooltip:float.close" data-tooltip-dir="bottom" data-tooltip-align="right">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <div class="analog-dial-cycler">
                    <button class="analog-ov-btn" id="btn-dial-prev" data-tooltip="Previous design" data-i18n-attr="data-tooltip:float.prevSkin">
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="analog-dial-badge" id="analog-dial-badge" data-tooltip="Design" data-i18n-attr="data-tooltip:float.skin">
                        <span id="analog-badge-text">1/10</span>
                    </div>
                    <button class="analog-ov-btn" id="btn-dial-next" data-tooltip="Next design" data-i18n-attr="data-tooltip:float.nextSkin">
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Cyber Context Menu (outside shell so it is never clipped by the circular frame) -->
        <div class="analog-ctx-menu" id="analog-ctx-menu" hidden>
            <div class="analog-ctx-header">
                <span class="ctx-hdr-title" data-i18n="float.analogTitle">Analog Clock</span>
            </div>
            <div class="analog-ctx-sep"></div>

            <div class="analog-ctx-section">
                <span class="analog-ctx-section-title" data-i18n="float.skin">Design</span>
                <div class="analog-skin-grid" id="analog-skin-grid">
                    <!-- Skin buttons generated dynamically -->
                </div>
            </div>

            <div class="analog-ctx-sep"></div>

            <button class="analog-ctx-item" id="ctx-aot">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="17" x2="12" y2="22"></line>
                    <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
                </svg>
                <span class="ctx-label" data-i18n="float.alwaysOnTop">Always on Top</span>
                <span class="ctx-check" id="ctx-aot-check">✓</span>
            </button>

            <div class="analog-ctx-sep"></div>

            <div class="analog-ctx-section">
                <span class="analog-ctx-section-title" data-i18n="float.opacity">Opacity</span>
                <div class="analog-ctx-opacity-chips">
                    <button class="analog-op-chip" data-op="1.0">100%</button>
                    <button class="analog-op-chip" data-op="0.85">85%</button>
                    <button class="analog-op-chip" data-op="0.70">70%</button>
                    <button class="analog-op-chip" data-op="0.50">50%</button>
                    <button class="analog-op-chip" data-op="0.40">40%</button>
                </div>
            </div>

            <div class="analog-ctx-sep"></div>

            <button class="analog-ctx-item" id="ctx-full">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
                <span class="ctx-label" data-i18n="float.fullMode">Open Full Mode</span>
            </button>
            <div class="analog-ctx-sep"></div>
            <button class="analog-ctx-item" id="ctx-new-timer">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <path d="M12 9v4l2.5 2.5M9 2h6"></path>
                </svg>
                <span class="ctx-label" data-i18n="float.newTimer">New Timer</span>
            </button>
            <button class="analog-ctx-item" id="ctx-new-sw">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <path d="M12 9v4M12 5V2M10 2h4"></path>
                </svg>
                <span class="ctx-label" data-i18n="float.newStopwatch">New Stopwatch</span>
            </button>
            <button class="analog-ctx-item" id="ctx-new-cal">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="ctx-label" data-i18n="float.calTitle">Calendar</span>
            </button>

            <div class="analog-ctx-sep"></div>

            <button class="analog-ctx-item ctx-danger" id="ctx-close">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span class="ctx-label" data-i18n="float.close">Close</span>
            </button>
        </div>
        <script src="analog.js"></script>
    </body>
</html>
