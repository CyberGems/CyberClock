<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="../favicon.ico" />
        <title>CyberClock Tray Menu</title>
        <link rel="stylesheet" href="../shared/themes.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <script src="../shared/tauri-bridge.js"></script>
        <script src="../shared/tint.js"></script>
        <script src="../shared/i18n.js"></script>
        <script src="../shared/icons.js"></script>
        <script src="../shared/suite-data.js"></script>
        <link rel="stylesheet" href="tray.css" />
    </head>
    <body>
        <div class="tray-root" id="tray-root">
            <div class="tray-card" role="menu">
                <div class="tray-deck" id="tray-deck" data-view="main">
                    <!-- ── MAIN VIEW ── -->
                    <div class="tray-view" id="view-main">
                        <!-- Header (suite-standard branding: icon + name, click -> About) -->
                        <button type="button" class="tray-header" data-action="about-modal" title="CyberClock: About" id="btn-about">
                            <img class="tray-head-ico" src="../assets/images/icon.png" alt="" />
                            <span class="app-title">Cyber<span class="app-title-accent">Clock</span> <span class="app-ver" id="app-ver">v1.6.1</span></span>
                        </button>

                        <div class="tray-divider"></div>

                        <!-- Primary Controls -->
                        <div class="tray-group">
                            <button type="button" class="tray-item" data-action="toggle_visibility" id="btn-visibility">
                                <span class="ico" data-ico="eye" id="ico-visibility"></span>
                                <span class="label" id="lbl-visibility">Show Clock</span>
                                <span class="hotkey-hint" id="hint-visibility" hidden>Alt+Shift+C</span>
                            </button>

                            <button type="button" class="tray-item" data-action="toggle_mode" id="btn-mode">
                                <span class="ico" data-ico="expand" id="ico-mode"></span>
                                <span class="label" id="lbl-mode">Switch to Full Mode</span>
                            </button>
                        </div>

                        <div class="tray-divider"></div>

                        <!-- Navigation Group -->
                        <div class="tray-group">
                            <button type="button" class="tray-item" data-action="new_timer">
                                <span class="ico" data-ico="timer"></span>
                                <span class="label" id="lbl-timer">New Timer</span>
                            </button>

                            <button type="button" class="tray-item" data-action="new_stopwatch">
                                <span class="ico" data-ico="stopwatch"></span>
                                <span class="label" id="lbl-stopwatch">New Stopwatch</span>
                            </button>

                            <button type="button" class="tray-item" data-action="new_calendar">
                                <span class="ico" data-ico="calendar"></span>
                                <span class="label" id="lbl-calendar">New Calendar</span>
                            </button>

                            <button type="button" class="tray-item" data-action="new_analog">
                                <span class="ico" data-ico="clock"></span>
                                <span class="label" id="lbl-analog">New Analog Clock</span>
                            </button>

                            <button type="button" class="tray-item" data-action="relax">
                                <span class="ico" data-ico="lotus"></span>
                                <span class="label" id="lbl-relax">Relax</span>
                            </button>

                            <button type="button" class="tray-item tray-relax-toggle" id="btn-relax-toggle" hidden>
                                <span class="ico" data-ico="pause" id="ico-relax-toggle"></span>
                                <span class="label" id="lbl-relax-toggle">Pause relax</span>
                            </button>

                            <button type="button" class="tray-item" data-action="settings">
                                <span class="ico" data-ico="gear"></span>
                                <span class="label" id="lbl-settings">Settings...</span>
                            </button>
                        </div>

                        <div class="tray-divider"></div>

                        <!-- Mini Zoom + Click-through -->
                        <div class="tray-group">
                            <div class="tray-slider-row">
                                <span class="tray-slider-lbl" id="lbl-zoom">Zoom</span>
                                <input type="range" id="tray-zoom" min="0" max="3" step="1" value="1" aria-label="Mini clock zoom" />
                                <span class="tray-slider-val" id="tray-zoom-val">100%</span>
                            </div>
                            <button type="button" class="tray-item" id="btn-clickthrough" aria-pressed="false">
                                <span class="ico" data-ico="eye-off" id="ico-clickthrough"></span>
                                <span class="label" id="lbl-clickthrough">Click-through</span>
                                <span class="audio-dot" id="clickthrough-dot" aria-hidden="true"></span>
                            </button>
                        </div>

                        <div class="tray-divider"></div>

                        <!-- Master audio mute -->
                        <div class="tray-group">
                            <button type="button" class="tray-item" id="btn-audio" aria-pressed="false">
                                <span class="ico" data-ico="volume-high" id="ico-audio"></span>
                                <span class="label" id="lbl-audio">Sound</span>
                                <span class="audio-dot" id="audio-dot" aria-hidden="true"></span>
                            </button>
                        </div>

                        <div class="tray-divider"></div>

                        <!-- Submenu Drill-Down Links -->
                        <div class="tray-group">
                            <button type="button" class="tray-item tray-nav-item" id="btn-nav-help">
                                <span class="ico" data-ico="help"></span>
                                <span class="label" id="lbl-help">Help</span>
                                <span class="tray-nav-arrow" data-ico="back"></span>
                            </button>

                            <button type="button" class="tray-item tray-nav-item" id="btn-nav-suite">
                                <span class="ico" data-ico="gem"></span>
                                <span class="label" id="lbl-suite">More from CyberGems</span>
                                <span class="tray-nav-arrow" data-ico="back"></span>
                            </button>
                        </div>

                        <div class="tray-divider"></div>

                        <!-- Exit Group -->
                        <div class="tray-group tray-group-exit">
                            <button type="button" class="tray-item tray-item-exit" data-action="quit">
                                <span class="ico" data-ico="power"></span>
                                <span class="label" id="lbl-quit">Exit</span>
                            </button>
                        </div>
                    </div>

                    <!-- ── HELP SUB-VIEW ── -->
                    <div class="tray-view tray-view-sub" id="view-help">
                        <div class="tray-sub-header">
                            <button type="button" class="tray-back-btn" id="btn-back-help">
                                <span class="ico" data-ico="back"></span>
                                <span class="label" id="lbl-back-help">Back</span>
                            </button>
                            <span class="tray-sub-title" id="lbl-help-title">Help</span>
                        </div>

                        <div class="tray-divider"></div>

                        <div class="tray-group">
                            <button type="button" class="tray-item tray-sub-item" data-action="center-widgets" data-tooltip="Center open clock and widgets on the active screen" data-i18n-attr="data-tooltip:tray.centerWidgetsTip" data-tooltip-dir="left">
                                <span class="ico" data-ico="target"></span>
                                <span class="label" id="lbl-center-widgets">Center widgets on screen</span>
                            </button>
                            <div class="tray-sub-sep"></div>
                            <button type="button" class="tray-item tray-sub-item" data-action="pin-tray-icon">
                                <span class="ico" data-ico="pin"></span>
                                <span class="label" id="lbl-pin-tray">Pin icon to taskbar...</span>
                            </button>
                            <button type="button" class="tray-item tray-sub-item" data-action="datetime-properties">
                                <span class="ico" data-ico="clock"></span>
                                <span class="label" id="lbl-datetime">Date and time properties...</span>
                            </button>
                            <div class="tray-sub-sep"></div>
                            <button type="button" class="tray-item tray-sub-item" data-action="faq">
                                <span class="ico" data-ico="faq"></span>
                                <span class="label" id="lbl-faq">FAQ</span>
                            </button>
                            <button type="button" class="tray-item tray-sub-item" data-action="changelog">
                                <span class="ico" data-ico="changelog"></span>
                                <span class="label" id="lbl-changelog">Changelog</span>
                            </button>
                            <button type="button" class="tray-item tray-sub-item" data-action="website">
                                <span class="ico" data-ico="globe"></span>
                                <span class="label" id="lbl-website">Website</span>
                            </button>
                            <button type="button" class="tray-item tray-sub-item" data-action="donate">
                                <span class="ico ico-heart" data-ico="heart"></span>
                                <span class="label" id="lbl-donate">Donate</span>
                            </button>
                            <div class="tray-sub-sep"></div>
                            <button type="button" class="tray-item tray-sub-item" data-action="about-modal">
                                <span class="ico" data-ico="info"></span>
                                <span class="label" id="lbl-about">About...</span>
                            </button>
                            <button type="button" class="tray-item tray-sub-item" data-action="check-updates">
                                <span class="ico" data-ico="refresh"></span>
                                <span class="label" id="lbl-check-updates">Check for Update...</span>
                            </button>
                        </div>
                    </div>

                    <!-- ── TRAY PIN TIP VIEW ── -->
                    <div class="tray-view tray-view-sub tray-pin-tip-view" id="view-pin-tip">
                        <div class="tray-sub-header">
                            <button type="button" class="tray-back-btn" id="btn-back-pin-tip">
                                <span class="ico" data-ico="back"></span>
                                <span class="label" id="lbl-back-pin-tip">Back</span>
                            </button>
                            <span class="tray-sub-title" id="lbl-pin-tip-title">Keep CyberClock visible in the tray</span>
                        </div>

                        <div class="tray-divider"></div>

                        <div class="tray-pin-tip-content">
                            <div class="tray-pin-tip-hero">
                                <div class="tray-pin-tip-logo-wrap">
                                    <img class="tray-pin-tip-logo" src="../assets/images/icon.png" alt="" />
                                </div>
                                <p class="tray-pin-tip-body" id="tray-pin-tip-body">
                                    Windows hides new tray icons behind the overflow (^). Drag CyberClock onto the taskbar, or pin it in Windows Settings.
                                </p>
                            </div>

                            <label class="tray-pin-tip-check">
                                <input type="checkbox" id="tray-pin-tip-dont-show" />
                                <span id="lbl-pin-tip-dont-show">Don't show again</span>
                            </label>

                            <div class="tray-pin-tip-actions">
                                <button type="button" class="tray-pin-tip-btn tray-pin-tip-btn-secondary" id="btn-pin-tip-got-it">
                                    <span id="lbl-pin-tip-got-it">Got it</span>
                                </button>
                                <button type="button" class="tray-pin-tip-btn tray-pin-tip-btn-primary" id="btn-pin-tip-settings">
                                    <span id="lbl-pin-tip-open-settings">Open Windows Settings</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ── SUITE SUB-VIEW ── -->
                    <div class="tray-view tray-view-sub" id="view-suite">
                        <div class="tray-sub-header">
                            <button type="button" class="tray-back-btn" id="btn-back-suite">
                                <span class="ico" data-ico="back"></span>
                                <span class="label" id="lbl-back-suite">Back</span>
                            </button>
                            <span class="tray-sub-title" id="lbl-suite-title">CyberGems</span>
                        </div>

                        <div class="tray-divider"></div>

                        <div class="tray-group tray-suite-list" id="tray-suite-list">
                            <!-- Populated dynamically from suite-data.js -->
                        </div>

                        <div class="tray-divider"></div>

                        <div class="tray-group">
                            <button type="button" class="tray-item tray-suite-all-btn" id="btn-suite-more">
                                <span class="ico" data-ico="globe"></span>
                                <span class="label" id="lbl-suite-all">View all at cybergems.org →</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- About opens the dedicated About window (backend routes the
                 "about-modal" action) — the old 232px in-menu modal was too
                 small for the content it carried. -->
        </div>
        <!-- tray-card -->

        <script src="tray.js"></script>
    </body>
</html>
