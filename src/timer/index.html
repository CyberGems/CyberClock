<!DOCTYPE html>
<!--

  The Timer view is now built inline inside main/index.html (#view-timer).
  Edits to this file will NOT appear in the app.
  See AGENTS.md § "Frontend Architecture" for the canonical file map.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberClock — Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/icons.js"></script>
<style>
  html,body{width:800px;height:620px;overflow:hidden;}
  .shell{width:100%;height:100%;display:flex;flex-direction:column;
    background:var(--bg-00);border:1px solid var(--border-bright);
    border-radius:10px;overflow:hidden;position:relative;}
  .shell::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent-a),transparent);
    opacity:.9;box-shadow:var(--glow-md);z-index:10;}

  /* Title bar */
  .tbar{height:46px;display:flex;align-items:center;padding:0 16px;gap:10px;
    background:var(--bg-01);border-bottom:1px solid var(--border);
    -webkit-app-region:drag;flex-shrink:0;}
  .brand{font-size:11px;font-weight:700;letter-spacing:3px;
    color:var(--accent-a);text-shadow:var(--glow-sm);text-transform:uppercase;}
  .tbar .spacer{flex:1;}
  .wmbtn{-webkit-app-region:no-drag;background:transparent;border:1px solid var(--border);
    color:var(--text-md);width:26px;height:26px;border-radius:4px;font-size:12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .wmbtn:hover{color:var(--accent-a);border-color:var(--border-bright);box-shadow:var(--glow-xs);}
  .wmbtn.close:hover{color:#ff4466;border-color:#ff4466;}
  .back-btn{-webkit-app-region:no-drag;background:transparent;border:1px solid var(--border);
    color:var(--text-md);font-family:'Orbitron',monospace;font-size:9px;
    letter-spacing:1.5px;padding:5px 12px;border-radius:4px;cursor:pointer;transition:all .18s;}
  .back-btn:hover{color:var(--accent-a);border-color:var(--border-bright);}

  /* Main area */
  .main{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:20px 30px;gap:20px;-webkit-app-region:no-drag;
    position:relative;}

  /* Radial bg glow */
  .main::before{content:'';position:absolute;top:50%;left:50%;
    transform:translate(-50%,-55%);width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(var(--rgb-accent),.06) 0%,transparent 70%);
    pointer-events:none;}

  /* Giant display */
  .display{display:flex;align-items:center;gap:8px;position:relative;}
  .seg-box{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .seg{font-family:'Orbitron',monospace;font-size:96px;font-weight:900;
    color:var(--accent-a);text-shadow:var(--glow-lg);line-height:1;
    background:var(--bg-02);padding:8px 16px;border-radius:8px;
    border:1px solid var(--border);min-width:140px;text-align:center;
    transition:text-shadow .3s;}
  .digit{display:inline-block;width:1ch;text-align:center;}
  .seg-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;
    letter-spacing:3px;color:var(--text-lo);text-transform:uppercase;}
  .colon{font-family:'Orbitron',monospace;font-size:80px;font-weight:900;
    color:var(--accent-a);text-shadow:var(--glow-md);margin-bottom:14px;
    opacity:.8;transition:opacity .5s;}
  .colon.blink{animation:colon-blink 1s step-end infinite;}
  @keyframes colon-blink{0%,100%{opacity:.8}50%{opacity:.15}}

  /* Warning state */
  .display.warning .seg{color:#ff4444;text-shadow:0 0 20px #ff4444,0 0 40px rgba(255,68,68,.5);}
  .display.warning .colon{color:#ff4444;}

  /* Progress ring */
  .progress-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
  #prog-svg{transform:rotate(-90deg);}
  .prog-track{fill:none;stroke:var(--bg-03);stroke-width:6;}
  .prog-fill{fill:none;stroke-width:6;stroke-linecap:round;
    transition:stroke-dashoffset .5s linear,stroke .3s;}

  /* Presets */
  .presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .preset-btn{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1.5px;
    text-transform:uppercase;background:transparent;border:1px solid var(--border-bright);
    color:var(--text-md);padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .18s;}
  .preset-btn:hover{color:var(--accent-a);border-color:var(--border-active);box-shadow:var(--glow-xs);}
  .preset-btn.active{background:var(--accent-dim);color:var(--accent-a);
    border-color:var(--border-active);box-shadow:var(--glow-xs);}

  /* Manual input */
  .manual-row{display:flex;align-items:center;gap:6px;}
  .time-input{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;
    width:60px;background:var(--bg-02);border:1px solid var(--border-bright);
    color:var(--accent-a);text-align:center;border-radius:6px;padding:4px;
    outline:none;-webkit-app-region:no-drag;}
  .time-input:focus{border-color:var(--border-active);box-shadow:var(--glow-xs);}
  .input-colon{font-family:'Orbitron',monospace;font-size:20px;color:var(--text-lo);}
  .input-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;
    color:var(--text-lo);letter-spacing:2px;text-align:center;display:block;margin-top:3px;}

  /* Controls */
  .controls{display:flex;gap:14px;align-items:center;}
  .cbtn{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;background:transparent;
    border:1px solid var(--border-bright);color:var(--accent-a);
    padding:12px 32px;border-radius:6px;cursor:pointer;
    position:relative;overflow:hidden;transition:all .18s;min-width:150px;}
  .cbtn::before{content:'';position:absolute;inset:0;background:var(--accent-a);opacity:0;transition:opacity .18s;}
  .cbtn:hover{box-shadow:var(--glow-md);border-color:var(--border-active);}
  .cbtn:hover::before{opacity:.08;}
  .cbtn:active{transform:scale(.96);}
  .cbtn:disabled{opacity:.35;cursor:not-allowed;}
  .cbtn.danger{border-color:rgba(255,68,68,.4);color:#ff4444;}
  .cbtn.danger:hover{box-shadow:0 0 12px rgba(255,68,68,.4);}

  /* Done overlay */
  .done-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s;
    border-radius:10px;}
  .done-overlay.visible{opacity:1;pointer-events:all;}
  .done-text{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;
    color:var(--accent-a);text-shadow:var(--glow-lg);letter-spacing:4px;
    animation:breathe 1s ease-in-out infinite;}

  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);}
  body.no-scanlines .scanlines{opacity:0;}

  /* Corner decorations */
  .cd{position:absolute;width:16px;height:16px;border-color:var(--accent-a);
    border-style:solid;opacity:.5;}
  .cd.tl{top:54px;left:6px;border-width:2px 0 0 2px;}
  .cd.tr{top:54px;right:6px;border-width:2px 2px 0 0;}
  .cd.bl{bottom:6px;left:6px;border-width:0 0 2px 2px;}
  .cd.br{bottom:6px;right:6px;border-width:0 2px 2px 0;}
</style>
</head>
<body data-theme="arctic-ice">
<div class="shell" id="shell">
  <div class="cd tl"></div><div class="cd tr"></div>
  <div class="cd bl"></div><div class="cd br"></div>

  <div class="tbar">
    <button class="back-btn" id="btn-back"><span data-ico="back"></span> BACK</button>
    <span class="brand"><span data-ico="timer"></span> Timer · CyberClock</span>
    <div class="spacer"></div>
    <button class="wmbtn" id="btn-min"><span data-ico="minimize"></span></button>
    <button class="wmbtn close" id="btn-close"><span data-ico="x"></span></button>
  </div>

  <div class="main">
    <!-- Progress ring (SVG) above display -->
    <div class="progress-wrap">
      <svg id="prog-svg" width="0" height="0" style="position:absolute;pointer-events:none;"></svg>
    </div>

    <!-- Giant countdown display -->
    <div class="display" id="display">
      <div class="seg-box">
        <div class="seg" id="seg-h">00</div>
        <span class="seg-lbl">HH</span>
      </div>
      <div class="colon" id="colon1">:</div>
      <div class="seg-box">
        <div class="seg" id="seg-m">00</div>
        <span class="seg-lbl">MM</span>
      </div>
      <div class="colon" id="colon2">:</div>
      <div class="seg-box">
        <div class="seg" id="seg-s">00</div>
        <span class="seg-lbl">SS</span>
      </div>
    </div>

    <!-- Neon progress bar -->
    <div style="width:520px;height:4px;background:var(--bg-03);border-radius:2px;position:relative;overflow:hidden;">
      <div id="prog-bar" style="height:100%;width:0%;background:var(--accent-a);border-radius:2px;
        box-shadow:var(--glow-sm);transition:width .5s linear,background .3s;"></div>
    </div>

    <!-- Preset buttons -->
    <div class="presets" id="presets">
      <button class="preset-btn" data-s="60">1m</button>
      <button class="preset-btn" data-s="300">5m</button>
      <button class="preset-btn" data-s="600">10m</button>
      <button class="preset-btn" data-s="900">15m</button>
      <button class="preset-btn" data-s="1500">25m</button>
      <button class="preset-btn" data-s="1800">30m</button>
      <button class="preset-btn" data-s="2700">45m</button>
      <button class="preset-btn" data-s="3600">1h</button>
      <button class="preset-btn" data-s="7200">2h</button>
    </div>

    <!-- Manual input -->
    <div class="manual-row">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <input class="time-input" id="inp-h" type="number" min="0" max="23" value="0">
        <span class="input-lbl">HOURS</span>
      </div>
      <span class="input-colon">:</span>
      <div style="display:flex;flex-direction:column;align-items:center;">
        <input class="time-input" id="inp-m" type="number" min="0" max="59" value="0">
        <span class="input-lbl">MINS</span>
      </div>
      <span class="input-colon">:</span>
      <div style="display:flex;flex-direction:column;align-items:center;">
        <input class="time-input" id="inp-s" type="number" min="0" max="59" value="0">
        <span class="input-lbl">SECS</span>
      </div>
    </div>

    <!-- Control buttons -->
    <div class="controls">
      <button class="cbtn" id="btn-start"><span data-ico="play"></span> START</button>
      <button class="cbtn danger" id="btn-reset" disabled><span data-ico="stop"></span> RESET</button>
    </div>
  </div><!-- .main -->

  <!-- Done overlay -->
  <div class="done-overlay" id="done-overlay">
    <div class="done-text">TIME'S UP!</div>
    <button class="cbtn" id="btn-dismiss" style="min-width:120px;font-size:10px;">DISMISS</button>
  </div>
</div>

<div class="scanlines"></div>
<script src="../shared/audio-engine.js"></script>
<script>
let cfg = {};
let totalSecs = 0;
let remainSecs = 0;
let running = false;
let startTime = null;
let pauseRemain = 0;
let intervalId = null;
let activePreset = null;

function pad(n){ return String(n).padStart(2,'0'); }

function applySettings(s){
  cfg = s;
  document.body.dataset.theme = s.theme || 'cyber-blue';
  if(s.scanlines===false) document.body.classList.add('no-scanlines');
  else document.body.classList.remove('no-scanlines');
}

function setDigits(el, val){
  el.innerHTML = val.split('').map(c => `<span class="digit">${c}</span>`).join('');
}

function setDisplay(secs){
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  const s2 = secs%60;
  setDigits(document.getElementById('seg-h'), pad(h));
  setDigits(document.getElementById('seg-m'), pad(m));
  setDigits(document.getElementById('seg-s'), pad(s2));

  const display = document.getElementById('display');
  display.classList.toggle('warning', secs <= 10 && secs > 0 && running);

  // Progress bar
  const pct = totalSecs > 0 ? ((totalSecs - secs) / totalSecs) * 100 : 0;
  const bar = document.getElementById('prog-bar');
  bar.style.width = pct + '%';
  bar.style.background = secs <= 10 && secs > 0 ? '#ff4444' : 'var(--accent-a)';
  bar.style.boxShadow = secs <= 10 && secs > 0
    ? '0 0 8px rgba(255,68,68,.6)' : 'var(--glow-sm)';
}

function setInputs(secs){
  document.getElementById('inp-h').value = Math.floor(secs/3600);
  document.getElementById('inp-m').value = Math.floor((secs%3600)/60);
  document.getElementById('inp-s').value = secs%60;
}

function getInputSecs(){
  const h = parseInt(document.getElementById('inp-h').value)||0;
  const m = parseInt(document.getElementById('inp-m').value)||0;
  const s = parseInt(document.getElementById('inp-s').value)||0;
  return h*3600 + m*60 + s;
}

function startTimer(){
  if(!running){
    if(pauseRemain > 0){
      remainSecs = pauseRemain;
      pauseRemain = 0;
    } else {
      totalSecs = getInputSecs();
      remainSecs = totalSecs;
    }
    if(remainSecs <= 0) return;
    running = true;
    startTime = Date.now();
    document.getElementById('btn-start').textContent = '⏸ PAUSE';
    document.getElementById('btn-reset').disabled = false;
    document.getElementById('colon1').classList.add('blink');
    document.getElementById('colon2').classList.add('blink');
    intervalId = setInterval(tick, 250);
  } else {
    // Pause
    running = false;
    pauseRemain = remainSecs;
    clearInterval(intervalId);
    document.getElementById('btn-start').innerHTML = '<span data-ico="play"></span> RESUME';
    window.ccIcons && window.ccIcons.replaceIcons(document.getElementById('btn-start'));
    document.getElementById('colon1').classList.remove('blink');
    document.getElementById('colon2').classList.remove('blink');
  }
}

function tick(){
  if(!running) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  remainSecs = Math.max(0, (pauseRemain || totalSecs) - elapsed);

  // Recalculate based on start time
  const base = totalSecs - Math.floor((Date.now() - startTime)/1000);
  remainSecs = Math.max(0, base + (pauseRemain > 0 ? pauseRemain - totalSecs : 0));

  setDisplay(remainSecs);

  if(remainSecs <= 0){
    clearInterval(intervalId);
    running = false;
    pauseRemain = 0;
    onComplete();
  }
}

// Simpler tick using accumulated time
let lastTick = null;
let accumulated = 0;

function startTimerClean(){
  if(running){
    // pause
    running = false;
    accumulated = remainSecs;
    clearInterval(intervalId);
    document.getElementById('btn-start').innerHTML = '<span data-ico="play"></span> RESUME';
    window.ccIcons && window.ccIcons.replaceIcons(document.getElementById('btn-start'));
    document.getElementById('colon1').classList.remove('blink');
    document.getElementById('colon2').classList.remove('blink');
    return;
  }
  // start or resume
  if(accumulated === 0){
    totalSecs = getInputSecs();
    accumulated = totalSecs;
  }
  if(accumulated <= 0) return;
  remainSecs = accumulated;
  running = true;
  lastTick = Date.now();
  document.getElementById('btn-start').textContent = '⏸ PAUSE';
  document.getElementById('btn-reset').disabled = false;
  document.getElementById('colon1').classList.add('blink');
  document.getElementById('colon2').classList.add('blink');
  clearInterval(intervalId);
  intervalId = setInterval(tickClean, 200);
}

function tickClean(){
  if(!running) return;
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  accumulated = Math.max(0, accumulated - dt);
  remainSecs = Math.ceil(accumulated);
  setDisplay(remainSecs);
  if(accumulated <= 0){
    clearInterval(intervalId);
    running = false;
    accumulated = 0;
    onComplete();
  }
}

function resetTimer(){
  clearInterval(intervalId);
  running = false;
  accumulated = 0;
  remainSecs = 0;
  totalSecs = 0;
  setDisplay(0);
  document.getElementById('prog-bar').style.width = '0%';
  document.getElementById('btn-start').innerHTML = '<span data-ico="play"></span> START';
  window.ccIcons && window.ccIcons.replaceIcons(document.getElementById('btn-start'));
  document.getElementById('btn-reset').disabled = true;
  document.getElementById('colon1').classList.remove('blink');
  document.getElementById('colon2').classList.remove('blink');
  document.getElementById('display').classList.remove('warning');
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  activePreset = null;
}

function onComplete(){
  setDisplay(0);
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('btn-start').innerHTML = '<span data-ico="play"></span> START';
  window.ccIcons && window.ccIcons.replaceIcons(document.getElementById('btn-start'));
  document.getElementById('colon1').classList.remove('blink');
  document.getElementById('colon2').classList.remove('blink');
  // Play alarm
  window.audioEngine.chime(cfg.alarmSound || 'chime-crystal', cfg.alarmVolume || 0.75);
  // Flash display
  let flashes = 0;
  const flash = setInterval(() => {
    const segs = document.querySelectorAll('.seg');
    segs.forEach(s => s.style.opacity = s.style.opacity === '0.2' ? '1' : '0.2');
    if(++flashes >= 6) { clearInterval(flash); segs.forEach(s => s.style.opacity = '1'); }
  }, 200);
  // Show overlay
  document.getElementById('done-overlay').classList.add('visible');
}

// Preset buttons
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if(running) return;
    const s = parseInt(btn.dataset.s);
    totalSecs = s;
    accumulated = s;
    remainSecs = s;
    setDisplay(s);
    setInputs(s);
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activePreset = s;
  });
});

// Manual inputs — sync display
['inp-h','inp-m','inp-s'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if(!running){ const s = getInputSecs(); setDisplay(s); accumulated = s; totalSecs = s; }
  });
});

document.getElementById('btn-start').addEventListener('click', startTimerClean);
document.getElementById('btn-reset').addEventListener('click', () => {
  resetTimer();
  if(activePreset){ setDisplay(activePreset); setInputs(activePreset); accumulated = activePreset; totalSecs = activePreset; }
});
document.getElementById('btn-back').addEventListener('click', () => window.cc.closeWindow());
document.getElementById('btn-close').addEventListener('click', () => window.cc.closeWindow());
document.getElementById('btn-min').addEventListener('click', () => window.cc.minimizeWindow());
document.getElementById('btn-dismiss').addEventListener('click', () => {
  document.getElementById('done-overlay').classList.remove('visible');
  resetTimer();
  if(activePreset){ setDisplay(activePreset); setInputs(activePreset); accumulated = activePreset; totalSecs = activePreset; }
});

window.cc.onInit(s => applySettings(s));
window.cc.onSettingsUpdated(s => applySettings(s));
window.cc.onThemeChanged(t => { document.body.dataset.theme = t; });
</script>
</body>
</html>
