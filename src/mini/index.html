<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CyberClock Mini</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../shared/themes.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <script src="../shared/tauri-bridge.js"></script>
        <script src="../shared/i18n.js"></script>
        <script src="../shared/icons.js"></script>
        <style>
            /* ═══════════════════════════════════════════════════════
               BASE & RESET
               ═══════════════════════════════════════════════════════ */
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            *:focus { outline: none; }
            *:focus-visible { outline: none; }

            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent !important;
                user-select: none;
                -webkit-user-select: none;
                outline: none;
            }
            body:focus, body:focus-visible { outline: none; }

            /* ═══════════════════════════════════════════════════════
               MAIN SHELL - Base styles for all skins
               ═══════════════════════════════════════════════════════ */
            .mini-shell {
                display: flex;
                align-items: center;
                width: 100%;
                height: 100%;
                overflow: hidden;
                box-sizing: border-box;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: grab;
                position: relative;
                outline: none;
                box-shadow: none !important;
            }
            .mini-shell:focus, .mini-shell:focus-visible { outline: none; }
            .mini-shell:active { cursor: grabbing; }

            /* Scanlines overlay (global) */
            .scanlines {
                position: absolute;
                inset: 0;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.08) 2px,
                    rgba(0, 0, 0, 0.08) 4px
                );
                pointer-events: none;
                z-index: 100;
                border-radius: inherit;
            }
            body.no-scanlines .scanlines { opacity: 0; }

            /* ═══════════════════════════════════════════════════════
               OPACITY LAYERS
               .mini-bg  → background fill only (Background slider, --bg-op)
               content   → time/date/dot/buttons (Content slider, --fg-op)
               The shell's own border, box-shadow and ::before/::after
               decorations stay fully solid (the frame).
               ═══════════════════════════════════════════════════════ */
            .mini-bg {
                position: absolute;
                inset: 0;
                z-index: 0;
                border-radius: inherit;
                pointer-events: none;
                opacity: var(--bg-op, 1);
            }
            .mini-shell > .status-dot,
            .mini-shell > .time-block,
            .mini-shell > .sep,
            .mini-shell > .controls {
                position: relative;
                z-index: 1;
                opacity: var(--fg-op, 1);
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 1: Cyber Bar Pro
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="1"] .mini-bg {
                background: linear-gradient(135deg, var(--bg-02) 0%, var(--bg-01) 50%, var(--bg-02) 100%);
            }
            .mini-shell[data-design="1"] {
                height: 48px;
                border: 1px solid var(--border-bright);
                border-left: 4px solid var(--accent-a);
                border-radius: 10px;
                padding: 0 14px 0 8px;
                gap: 12px;
                box-shadow:
                    0 4px 20px rgba(0, 0, 0, 0.4),
                    0 0 20px rgba(var(--rgb-accent), 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }
            .mini-shell[data-design="1"]::before {
                content: '';
                position: absolute;
                top: 0;
                left: 10%;
                right: 10%;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--accent-a), transparent);
                opacity: 0.6;
            }
            .mini-shell[data-design="1"] #mini-time {
                font-family: "Share Tech Mono", monospace;
                font-size: 22px;
                font-weight: 400;
                color: var(--accent-a);
                letter-spacing: 2px;
                text-shadow: 0 0 10px rgba(var(--rgb-accent), 0.5);
                white-space: nowrap;
            }
            .mini-shell[data-design="1"] #mini-date {
                font-family: "Share Tech Mono", monospace;
                font-size: 10px;
                letter-spacing: 2px;
                color: var(--text-md);
                text-transform: uppercase;
                white-space: nowrap;
            }
            .mini-shell[data-design="1"] .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--accent-a);
                box-shadow: 0 0 8px var(--accent-a);
                animation: pulse-dot 2s ease-in-out infinite;
            }
            .mini-shell[data-design="1"] .sep {
                width: 1px;
                height: 24px;
                background: linear-gradient(to bottom, transparent, var(--border-bright), transparent);
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 2: Holo Display
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="2"] .mini-bg {
                background: var(--bg-02);
                backdrop-filter: blur(20px) saturate(1.8);
            }
            .mini-shell[data-design="2"] {
                height: 56px;
                border: 1px solid rgba(var(--rgb-accent), 0.25);
                border-radius: 12px;
                padding: 0 16px;
                gap: 14px;
                box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1),
                    0 0 30px rgba(var(--rgb-accent), 0.05);
            }
            .mini-shell[data-design="2"]::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 12px;
                background: linear-gradient(135deg, rgba(var(--rgb-accent), 0.05) 0%, transparent 50%, rgba(var(--rgb-accent), 0.03) 100%);
                pointer-events: none;
            }
            .mini-shell[data-design="2"] .time-block {
                align-items: center;
            }
            .mini-shell[data-design="2"] #mini-time {
                font-family: "JetBrains Mono", monospace;
                font-weight: 700;
                font-size: 24px;
                color: var(--accent-a);
                letter-spacing: 5px;
                text-shadow: 0 0 20px rgba(var(--rgb-accent), 0.8), 0 0 40px rgba(var(--rgb-accent), 0.4);
                white-space: nowrap;
            }
            .mini-shell[data-design="2"] #mini-date {
                font-family: "Share Tech Mono", monospace;
                font-weight: 400;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.6);
                letter-spacing: 1.5px;
                white-space: nowrap;
            }
            .mini-shell[data-design="2"] .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--accent-a);
                box-shadow: 0 0 12px var(--accent-a);
                animation: holo-pulse 3s ease-in-out infinite;
            }
            @keyframes holo-pulse {
                0%, 100% { opacity: 0.5; transform: scale(0.9); }
                50% { opacity: 1; transform: scale(1.1); }
            }
            .mini-shell[data-design="2"] .sep {
                width: 1px;
                height: 28px;
                background: linear-gradient(to bottom, transparent, rgba(var(--rgb-accent), 0.4), transparent);
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 3: Digital Matrix
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="3"] .mini-bg {
                background: #0a0a0f;
            }
            .mini-shell[data-design="3"] {
                height: 46px;
                border: 1px solid #1a1a2e;
                border-radius: 6px;
                padding: 0 12px;
                gap: 10px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.3);
            }
            .mini-shell[data-design="3"] #mini-time {
                font-family: "JetBrains Mono", monospace;
                font-size: 20px;
                font-weight: 700;
                color: #00ff88;
                letter-spacing: 1px;
                text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
                white-space: nowrap;
            }
            .mini-shell[data-design="3"] #mini-time::before {
                content: '> ';
                color: #ff6b35;
                text-shadow: 0 0 8px rgba(255, 107, 53, 0.5);
            }
            .mini-shell[data-design="3"] #mini-time::after {
                content: '_';
                color: #00ff88;
                animation: blink-cursor 1s step-end infinite;
            }
            @keyframes blink-cursor {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }
            .mini-shell[data-design="3"] #mini-date {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                color: #4a5568;
                letter-spacing: 1px;
                text-transform: uppercase;
                white-space: nowrap;
            }
            .mini-shell[data-design="3"] .status-dot {
                width: 6px;
                height: 6px;
                border-radius: 2px;
                background: #00ff88;
                box-shadow: 0 0 6px #00ff88;
                animation: matrix-blink 2s step-end infinite;
            }
            @keyframes matrix-blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.3; }
            }
            .mini-shell[data-design="3"] .sep {
                width: 1px;
                height: 22px;
                background: #1a1a2e;
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 4: Glass Orb
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="4"] .mini-bg {
                background: linear-gradient(135deg, #ffffff 0%, #eaf2fc 50%, #dce8f8 100%);
            }
            .mini-shell[data-design="4"] {
                height: 52px;
                border: 1px solid rgba(120, 140, 175, 0.45);
                border-radius: 26px;
                padding: 0 18px;
                gap: 12px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
                position: relative;
                overflow: hidden;
            }
            .mini-shell[data-design="4"]::before {
                content: '';
                position: absolute;
                top: 2px;
                left: 10%;
                right: 10%;
                height: 40%;
                background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
                border-radius: 24px;
                pointer-events: none;
            }
            .mini-shell[data-design="4"] #mini-time {
                font-family: "Outfit", sans-serif;
                font-weight: 400;
                font-size: 22px;
                color: #23314a;
                letter-spacing: 0.5px;
                text-shadow: none;
                white-space: nowrap;
            }
            .mini-shell[data-design="4"] #mini-date {
                font-family: "Outfit", sans-serif;
                font-weight: 400;
                font-size: 10px;
                color: rgba(60, 80, 120, 0.7);
                letter-spacing: 1px;
                white-space: nowrap;
            }
            .mini-shell[data-design="4"] .status-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent-a));
                box-shadow: 0 0 10px var(--accent-a);
                animation: orb-pulse 2.5s ease-in-out infinite;
            }
            @keyframes orb-pulse {
                0%, 100% { transform: scale(0.9); opacity: 0.7; }
                50% { transform: scale(1.1); opacity: 1; }
            }
            .mini-shell[data-design="4"] .sep {
                width: 1px;
                height: 26px;
                background: linear-gradient(to bottom, transparent, rgba(var(--rgb-accent), 0.3), transparent);
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 5: Neon Circuit
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="5"] .mini-bg {
                background: var(--bg-01);
            }
            .mini-shell[data-design="5"] {
                height: 50px;
                border: 1px solid var(--border-bright);
                border-radius: 8px;
                padding: 0 14px;
                gap: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(var(--rgb-accent), 0.15);
                position: relative;
                overflow: hidden;
            }
            .mini-shell[data-design="5"]::before {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(90deg, transparent 49.5%, rgba(var(--rgb-accent), 0.05) 49.5%, rgba(var(--rgb-accent), 0.05) 50.5%, transparent 50.5%),
                            linear-gradient(0deg, transparent 49.5%, rgba(var(--rgb-accent), 0.05) 49.5%, rgba(var(--rgb-accent), 0.05) 50.5%, transparent 50.5%);
                background-size: 20px 20px;
                pointer-events: none;
                opacity: 0.3;
            }
            .mini-shell[data-design="5"] #mini-time {
                font-family: "Orbitron", sans-serif;
                font-weight: 700;
                font-size: 20px;
                color: var(--accent-a);
                letter-spacing: 2px;
                text-shadow: 0 0 12px rgba(var(--rgb-accent), 0.7);
                white-space: nowrap;
            }
            .mini-shell[data-design="5"] #mini-date {
                font-family: "Share Tech Mono", monospace;
                font-size: 9px;
                color: var(--text-md);
                letter-spacing: 1px;
                text-transform: uppercase;
                white-space: nowrap;
            }
            .mini-shell[data-design="5"] .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 2px;
                background: var(--accent-a);
                box-shadow: 0 0 8px var(--accent-a);
                animation: circuit-pulse 1.5s ease-in-out infinite;
            }
            @keyframes circuit-pulse {
                0%, 100% { opacity: 0.4; }
                50% { opacity: 1; }
            }
            .mini-shell[data-design="5"] .sep {
                width: 1px;
                height: 24px;
                background: linear-gradient(to bottom, transparent, var(--border-bright), transparent);
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 6: Zen Minimal
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="6"] .mini-bg {
                background: #0a0a0f;
                backdrop-filter: blur(10px);
            }
            .mini-shell[data-design="6"] {
                height: 48px;
                border: 1px solid rgba(var(--rgb-accent), 0.2);
                border-radius: 24px;
                padding: 0 16px;
                gap: 14px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 1px rgba(var(--rgb-accent), 0.1);
            }
            .mini-shell[data-design="6"] #mini-time {
                font-family: "Outfit", sans-serif;
                font-weight: 300;
                font-size: 22px;
                color: #ffffff;
                letter-spacing: 0.5px;
                white-space: nowrap;
            }
            .mini-shell[data-design="6"] #mini-date {
                font-family: "Outfit", sans-serif;
                font-weight: 400;
                font-size: 10px;
                color: rgba(255, 255, 255, 0.4);
                letter-spacing: 0.5px;
                white-space: nowrap;
            }
            .mini-shell[data-design="6"] .status-dot {
                width: 14px;
                height: 14px;
                border: 2px solid var(--accent-a);
                background: transparent;
                border-radius: 50%;
                /* Static glow painted once; transform:scale grows it on the GPU
                   (composite-only) instead of animating box-shadow (repaint). */
                box-shadow: 0 0 10px 2px rgba(var(--rgb-accent), 0.3);
                will-change: transform, opacity;
                animation: zen-pulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
            }
            @keyframes zen-pulse {
                0%, 100% { transform: scale(0.85); opacity: 0.5; }
                50% { transform: scale(1.15); opacity: 1; }
            }
            .mini-shell[data-design="6"] .sep {
                width: 1px;
                height: 24px;
                background: linear-gradient(to bottom, transparent, rgba(var(--rgb-accent), 0.2), transparent);
            }

            /* Center time-block for tall skins that need it */
            .mini-shell[data-design="1"] .time-block,
            .mini-shell[data-design="4"] .time-block,
            .mini-shell[data-design="5"] .time-block,
            .mini-shell[data-design="6"] .time-block {
                align-items: center;
            }

            /* ═══════════════════════════════════════════════════════
               SHARED SINGLE-ROW OVERRIDES — Skins 7‑12
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="7"] .time-block,
            .mini-shell[data-design="8"] .time-block,
            .mini-shell[data-design="9"] .time-block,
            .mini-shell[data-design="10"] .time-block,
            .mini-shell[data-design="11"] .time-block,
            .mini-shell[data-design="12"] .time-block {
                flex-direction: row;
                align-items: center;
                gap: 5px;
                flex: 1;
                min-width: 0;
                overflow: hidden;
            }
            .mini-shell[data-design="7"] .controls,
            .mini-shell[data-design="8"] .controls,
            .mini-shell[data-design="9"] .controls,
            .mini-shell[data-design="10"] .controls,
            .mini-shell[data-design="11"] .controls,
            .mini-shell[data-design="12"] .controls {
                flex-direction: row;
                align-items: center;
                gap: 4px;
                flex-shrink: 0;
            }
            .mini-shell[data-design="7"] .status-dot,
            .mini-shell[data-design="8"] .status-dot,
            .mini-shell[data-design="9"] .status-dot,
            .mini-shell[data-design="10"] .status-dot,
            .mini-shell[data-design="11"] .status-dot,
            .mini-shell[data-design="12"] .status-dot {
                flex-shrink: 0;
            }
            .mini-shell[data-design="7"] .sep,
            .mini-shell[data-design="8"] .sep,
            .mini-shell[data-design="9"] .sep,
            .mini-shell[data-design="10"] .sep,
            .mini-shell[data-design="11"] .sep,
            .mini-shell[data-design="12"] .sep {
                display: none;
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 7: Sunset Pulse
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="7"] .mini-bg {
                background: linear-gradient(135deg, #1a0a1e 0%, #2d0f28 30%, #1e0a2a 70%, #0d0a1a 100%);
            }
            .mini-shell[data-design="7"] {
                height: 34px;
                border: 1px solid rgba(255, 107, 53, 0.35);
                border-radius: 22px;
                padding: 0 10px;
                gap: 6px;
                box-shadow:
                    0 4px 24px rgba(0, 0, 0, 0.45),
                    0 0 30px rgba(255, 107, 53, 0.08),
                    inset 0 1px 0 rgba(255, 140, 66, 0.12);
                position: relative;
                overflow: hidden;
            }
            .mini-shell[data-design="7"]::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, #ff8c42, #ff6b8a, transparent);
                opacity: 0.7;
            }
            .mini-shell[data-design="7"]::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, #ff6b8a, #ff8c42, transparent);
                opacity: 0.4;
            }
            .mini-shell[data-design="7"] #mini-time {
                font-family: "Orbitron", sans-serif;
                font-size: 12px;
                font-weight: 700;
                color: #ffb380;
                letter-spacing: 1px;
                text-shadow: 0 0 12px rgba(255, 140, 66, 0.6), 0 0 30px rgba(255, 107, 53, 0.3);
                white-space: nowrap;
            }
            .mini-shell[data-design="7"] #mini-date {
                font-family: "Outfit", sans-serif;
                font-size: 8px;
                font-weight: 300;
                color: rgba(255, 180, 140, 0.6);
                letter-spacing: 1px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
                text-align: center;
            }
            .mini-shell[data-design="7"] .status-dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #ff6b8a;
                box-shadow: 0 0 12px #ff6b8a, 0 0 24px rgba(255, 107, 138, 0.5);
                will-change: transform, opacity;
                animation: sunset-pulse 2.5s ease-in-out infinite;
            }
            @keyframes sunset-pulse {
                0%, 100% { transform: scale(1); opacity: 0.9; }
                50% { transform: scale(1.3); opacity: 1; }
            }
            .mini-shell[data-design="7"] .ctl-btn {
                color: rgba(255, 180, 140, 0.5);
            }
            .mini-shell[data-design="7"] .ctl-btn:hover {
                color: #ffb380;
                background: rgba(255, 140, 66, 0.15);
            }
            .mini-shell[data-design="7"] #btn-aot.active {
                color: #ff8c42;
                filter: drop-shadow(0 0 6px rgba(255, 140, 66, 0.6));
            }

            /* ═══════════════════════════════════════════════════════
               SKIN 8: Frost Crystal
               ═══════════════════════════════════════════════════════ */
            .mini-shell[data-design="8"] .mini-bg {
                background: linear-gradient(135deg, #f0f7ff 0%, #e2effd 50%, #d2e5fa 100%);
                backdrop-filter: blur(24px) saturate(2);
            }
            .mini-shell[data-design="8"] {
                height: 34px;
                border: 1px solid rgba(120, 170, 210, 0.5);
                border-radius: 10px;
                padding: 0 10px;
                gap: 6px;
                box-shadow:
                    0 4px 24px rgba(0, 0, 0, 0.35),
                    0 0 20px rgba(100, 200, 255, 0.06),
                    inset 0 1px 0 rgba(180, 230, 255, 0.1);
                position: relative;
                overflow: hidden;
            }
            .mini-shell[data-design="8"]::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 10px;
                background: linear-gradient(135deg, rgba(180, 230, 255, 0.06) 0%, transparent 50%, rgba(100, 200, 255, 0.03) 100%);
                pointer-events: none;
            }
            .mini-shell[data-design="8"]::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(100, 200, 255, 0.03) 60deg, transparent 120deg, rgba(100, 200, 255, 0.02) 180deg, transparent 240deg, rgba(100, 200, 255, 0.03) 300deg, transparent 360deg);
                /* Conic painted once into its own layer; only rotated on the GPU. */
                will-change: transform;
                animation: frost-rotate 12s linear infinite;
                pointer-events: none;
            }
            @keyframes frost-rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            .mini-shell[data-design="8"] #mini-time {
                font-family: "Outfit", sans-serif;
                font-size: 13px;
                font-weight: 400;
                color: #1c3a5e;
                letter-spacing: 1px;
                text-shadow: none;
                white-space: nowrap;
                position: relative;

                         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <g transform="rotate(45 12 12)">
                            <path d="M5 17h14v-1.76a2 2 0 0 0-.44-1.24l-2.78-3.58A2 2 0 0 1 15 9.18V5a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.18a2 2 0 0 1-.78 1.58l-2.78 3.58A2 2 0 0 0 5 15.24Z"/>
                            <path d="M12 17v5"/>
                        </g>
                    </svg>
                </button>
                <button class="ctl-btn" id="btn-full" title="Full mode">
                    <svg class="ctl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 3h6v6"/>
                        <path d="M9 21H3v-6"/>
                        <path d="M21 3l-7 7"/>
                        <path d="M3 21l7-7"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="mini-tip" id="mini-tip"></div>

        <script src="../shared/audio-engine.js"></script>
        <script>
            let cfg = {};
            let calNotes = {};
            
            function getDays() {
                const lang = window.ccI18n.getEffectiveLang();
                return lang === "es"
                    ? ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"]
                    : ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            }

            function getMonths() {
                const lang = window.ccI18n.getEffectiveLang();
                return lang === "es"
                    ? ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"]
                    : ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            }

            function isoNow() {
                const n = new Date();
                return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;
            }
            function countUpcoming() {
                const todayKey = isoNow();
                let c = 0;
                for (const k in calNotes) {
                    if ((calNotes[k]||"").trim() && k >= todayKey) c++;
                }
                return c;
            }

            function pad(n) { return String(n).padStart(2, "0"); }

            function updateClock() {
                const now = new Date();
                let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
                const designMode = cfg.miniDesign || 1;
                const noSeconds = false;

                let timeStr;
                if (cfg.clockFormat === "12h") {
                    const ampm = h >= 12 ? "PM" : "AM";
                    h = h % 12 || 12;
                    timeStr = `${pad(h)}:${pad(m)}${!noSeconds && cfg.showSeconds !== false ? ":" + pad(s) : ""} ${ampm}`;
                } else {
                    timeStr = `${pad(h)}:${pad(m)}${!noSeconds && cfg.showSeconds !== false ? ":" + pad(s) : ""}`;
                }
                document.getElementById("mini-time").textContent = timeStr;

                const d = now;
                const days = getDays();
                const months = getMonths();
                document.getElementById("mini-date").textContent =
                    `${days[d.getDay()]} · ${pad(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()}`;
            }

            // ═══════════════════════════════════════════════════════
            // WINDOW SIZING — Each skin has its own dimensions.
            // ═══════════════════════════════════════════════════════

            const DESIGN_HEIGHTS = { 1: 48, 2: 56, 3: 46, 4: 52, 5: 50, 6: 48, 7: 34, 8: 34, 9: 34, 10: 32, 11: 34, 12: 34 };
            const DESIGN_WIDTHS  = { 1: 260, 2: 320, 3: 260, 4: 260, 5: 260, 6: 260, 7: 300, 8: 300, 9: 300, 10: 260, 11: 300, 12: 300 };

            const COLLAPSED_HEIGHTS = { 1: 34, 2: 38, 3: 34, 4: 36, 5: 34, 6: 34, 7: 34, 8: 34, 9: 34, 10: 32, 11: 34, 12: 34 };
            const COLLAPSED_WIDTHS  = { 1: 260, 2: 320, 3: 260, 4: 260, 5: 260, 6: 260, 7: 165, 8: 165, 9: 175, 10: 155, 11: 175, 12: 170 };

            let isHovered = false;
            let isTipVisible = false;
            let lastAppliedWidth = 0;
            let lastAppliedHeight = 0;

            function getCurrentTargetSize() {
                const design = cfg.miniDesign || 1;
                const isCollapsible = cfg.miniCollapseDate === true;

                let baseWidth = DESIGN_WIDTHS[design] || 260;
                let baseHeight = DESIGN_HEIGHTS[design] || 48;

                if (isCollapsible && !isHovered) {
                    baseWidth = COLLAPSED_WIDTHS[design] || baseWidth;
                    baseHeight = COLLAPSED_HEIGHTS[design] || baseHeight;
                }

                if (isTipVisible) {
                    const tipHeight = tipEl.offsetHeight || 80;
                    baseHeight += tipHeight + 16;
                }

                return { width: baseWidth, height: baseHeight };
            }

            function syncWindowSize(force = false) {
                const target = getCurrentTargetSize();
                if (force || target.width !== lastAppliedWidth || target.height !== lastAppliedHeight) {
                    lastAppliedWidth = target.width;
                    lastAppliedHeight = target.height;
                    window.cc.setWindowSize(target);
                }
            }

            let lastDesign = null;
            let lastCollapse = null;
            function applySettings(s) {
                const designChanged = s.miniDesign !== lastDesign;
                const collapseChanged = s.miniCollapseDate !== lastCollapse;
                lastDesign = s.miniDesign;
                lastCollapse = s.miniCollapseDate;

                cfg = s;
                calNotes = s.calendarNotes || {};
                document.body.dataset.theme = s.theme || "arctic-ice";

                window.ccI18n.setLang(s.language || "auto");
                const btnAot = document.getElementById("btn-aot");
                if (btnAot) btnAot.title = window.ccI18n.t("mini.tooltip.aot");
                const btnFull = document.getElementById("btn-full");
                if (btnFull) btnFull.title = window.ccI18n.t("mini.tooltip.full");

                const shell = document.getElementById("shell");
                if (shell) {
                    shell.dataset.design = s.miniDesign || "1";
                    shell.classList.toggle("collapse-date", s.miniCollapseDate === true);
                    shell.style.setProperty("--bg-op", s.miniBgOpacity ?? 1.0);
                    shell.style.setProperty("--fg-op", s.miniOpacity ?? 1.0);
                }

                if (s.miniScanlines === false)
                    document.body.classList.add("no-scanlines");
                else document.body.classList.remove("no-scanlines");

                const aotOn = s.alwaysOnTop || false;
                document.getElementById("btn-aot").classList.toggle("active", aotOn);
                updateClock();

                // Resize window to match the skin height/width when design or collapse setting changes
                if (designChanged || collapseChanged || lastAppliedWidth === 0) {
                    syncWindowSize(true);
                }
            }

            // ═══════════════════════════════════════════════════════
            // HOVER TOOLTIP — today's note + upcoming count
            // ═══════════════════════════════════════════════════════
            const timeBlock = document.querySelector(".time-block");
            const tipEl = document.getElementById("mini-tip");
            const shellEl = document.getElementById("shell");
            let tipTimer = null;

            function refreshTipContent() {
                const now = new Date();
                const lang = window.ccI18n.getEffectiveLang();
                
                const locale = lang === "es" ? "es-ES" : "en-US";
                let dateStr = now.toLocaleDateString(locale, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
                
                const todayKey = isoNow();
                const note = (calNotes[todayKey] || "").trim();
                const upcoming = countUpcoming();
                
                let html = `<div class="mini-tip-date">${dateStr}</div>`;
                html += `<div class="mini-tip-divider"></div>`;
                
                if (note) {
                    const firstLine = note.split("\n")[0].trim();
                    html += `<div class="mini-tip-note">📝 ${firstLine}</div>`;
                } else {
                    const noNotesText = lang === "es" ? "Sin notas para hoy" : "No notes for today";
                    const createText = lang === "es" ? "＋ Crear nota" : "＋ Create note";
                    html += `<div class="mini-tip-note empty">🌸 ${noNotesText}</div>`;
                    html += `<div class="mini-tip-action-btn">${createText}</div>`;
                }
                
                let statText = "";
                if (upcoming === 0) {
                    statText = lang === "es" ? "Tu agenda está despejada" : "Your schedule is clear";
                } else if (upcoming === 1) {
                    statText = lang === "es" ? "1 evento próximo" : "1 upcoming event";
                } else {
                    statText = lang === "es" ? `<b>${upcoming}</b> eventos próximos` : `<b>${upcoming}</b> upcoming events`;
                }
                
                html += `<div class="mini-tip-stat">${statText}</div>`;
                tipEl.innerHTML = html;
            }

            function positionTip() {
                const r = shellEl.getBoundingClientRect();
                tipEl.style.left = r.left + r.width / 2 + "px";
                tipEl.style.top = r.bottom + 8 + "px";
            }

            const controlsEl = document.querySelector(".controls");

            function expandDate() {
                if (isHovered) return;
                isHovered = true;
                shellEl.classList.add("is-expanded");
                if (cfg.miniCollapseDate) {
                    syncWindowSize();
                }
            }

            function collapseDate() {
                if (!isHovered) return;
                isHovered = false;
                shellEl.classList.remove("is-expanded");
                if (cfg.miniCollapseDate) {
                    syncWindowSize();
                }
            }

            let isDragging = false;

            window.addEventListener("mouseup", () => {
                isDragging = false;
            });

            timeBlock.addEventListener("mouseenter", () => {
                if (isDragging) return;
                expandDate();
                refreshTipContent();
                positionTip();
                
                tipTimer = setTimeout(() => {
                    if (isDragging) return;
                    positionTip();
                    isTipVisible = true;
                    tipEl.classList.add("show");
                    syncWindowSize();
                }, 800);
            });

            timeBlock.addEventListener("mouseleave", (e) => {
                clearTimeout(tipTimer);
                tipTimer = null;
                isTipVisible = false;
                tipEl.classList.remove("show");
                if (e.relatedTarget && e.relatedTarget.closest(".controls")) {
                    collapseDate();
                }
            });

            // Status dot also triggers date expand
            const statusDot = document.querySelector(".status-dot");
            if (statusDot) {
                statusDot.addEventListener("mouseenter", () => {
                    if (!isDragging) expandDate();
                });
            }

            // Controls (buttons): DO NOT expand date. If already expanded, collapse it so buttons stay rock solid!
            if (controlsEl) {
                controlsEl.addEventListener("mouseenter", () => {
                    clearTimeout(tipTimer);
                    tipTimer = null;
                    isTipVisible = false;
                    tipEl.classList.remove("show");
                    collapseDate();
                });
            }

            document.body.addEventListener("mouseleave", () => {
                clearTimeout(tipTimer);
                tipTimer = null;
                isTipVisible = false;
                tipEl.classList.remove("show");
                miniHovered = false;
                collapseDate();
                syncMiniMotion();
                syncWindowSize();
            });

            shellEl.addEventListener("mouseenter", () => {
                miniHovered = true;
                syncMiniMotion();
            });

            shellEl.addEventListener("mouseleave", () => {
                miniHovered = false;
                syncMiniMotion();
                collapseDate();
            });

            tipEl.addEventListener("click", () => {
                const todayKey = isoNow();
                window.cc.goFull();
                window.cc.menuAction("open-note:" + todayKey);
            });

            // ═══════════════════════════════════════════════════════
            // INITIALIZATION
            // ═══════════════════════════════════════════════════════
            // Decorative CSS animations keep the (transparent, always-on-top)
            // window recompositing every vsync, which is the main idle-CPU cost
            // of the mini view. Pause them whenever the window is hidden, or it
            // is unfocused and the cursor isn't over it. The clock text still
            // updates every second regardless, so the time is never stale.
            let miniHovered = false;
            function syncMiniMotion() {
                const shouldPause =
                    document.hidden || (!document.hasFocus() && !miniHovered);
                document.body.classList.toggle("mini-paused", shouldPause);
            }

            document.addEventListener("visibilitychange", syncMiniMotion);
            window.addEventListener("focus", syncMiniMotion);
            window.addEventListener("blur", syncMiniMotion);

            window.cc.onInit((s) => {
                applySettings(s);
                syncMiniMotion();
                requestAnimationFrame(() => {
                    setInterval(updateClock, 1000);
                });
            });

            window.cc.onSettingsUpdated((s) => applySettings(s));

            window.cc.onAlarmChime((p) => {
                if (p.customPath) window.audioEngine.playFile(p.customPath, { loop: false });
                else window.audioEngine.chime(p.sound || "chime-digital", cfg.alarmVolume || 0.75);
            });

            // ═══════════════════════════════════════════════════════
            // BUTTON HANDLERS
            // ═══════════════════════════════════════════════════════
            document.getElementById("btn-full").addEventListener("click", () => window.cc.goFull());
            document.getElementById("btn-aot").addEventListener("click", async () => {
                const on = !document.getElementById("btn-aot").classList.contains("active");
                window.cc.saveSettings({ alwaysOnTop: on });
                document.getElementById("btn-aot").classList.toggle("active", on);
            });

            // ═══════════════════════════════════════════════════════
            // CONTEXT MENU
            // ═══════════════════════════════════════════════════════
            const shell = document.getElementById("shell");
            shell.addEventListener("contextmenu", (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.cc.getWindowPosition().then(winPos => {
                    window.cc.openMiniContextMenu({
                        x: e.clientX, y: e.clientY,
                        screenX: winPos[0] + e.clientX, screenY: winPos[1] + e.clientY,
                    });
                }).catch(() => {
                    window.cc.openMiniContextMenu({
                        x: e.clientX, y: e.clientY,
                        screenX: e.screenX, screenY: e.screenY,
                    });
                });
            });

            // ═══════════════════════════════════════════════════════
            // DRAG — native Tauri only
            // ═══════════════════════════════════════════════════════
            shell.addEventListener("mousedown", (e) => {
                // Close context menu if open (it's a separate Tauri popup window)
                window.cc.closeMenuPopup().catch(() => {});
                if (e.target.closest(".controls")) return;
                if (e.button !== 0) return;

                // Immediately cancel and dismiss hover popup if visible/pending
                clearTimeout(tipTimer);
                tipTimer = null;
                if (isTipVisible) {
                    isTipVisible = false;
                    tipEl.classList.remove("show");
                    syncWindowSize();
                }

                if (cfg.miniPositionLocked === true) return;
                e.preventDefault();
                isDragging = true;
                window.cc.startDragging()
                    .then(() => {
                        isDragging = false;
                        window.cc.saveMiniPosition().catch(() => {});
                    })
                    .catch(() => {
                        isDragging = false;
                    });
            });
        </script>
    </body>
</html>
