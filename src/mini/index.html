<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="../favicon.ico" />
        <title>CyberClock Mini</title>
                <link rel="stylesheet" href="../shared/themes.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <script src="../shared/tauri-bridge.js"></script>
        <script src="../shared/tint.js"></script>
        <script src="../shared/i18n.js"></script>
        <script src="../shared/icons.js"></script>
        <link rel="stylesheet" href="mini.css" />
    </head>
    <body data-tint="ice">
        <div class="mini-shell" id="shell" data-design="1">
            <div class="mini-bg"></div>
            <div class="scanlines"></div>
            <div class="status-dot"></div>
            <div class="time-block">
                <div id="mini-time">00:00:00</div>
                <div id="mini-date">SAT · 01 JAN 2026</div>
            </div>
            <div class="sep"></div>
            <div class="controls">
                <button class="ctl-btn" id="btn-aot" title="Toggle Always on Top">
                    <svg class="ctl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <g transform="rotate(45 12 12)">
                            <path d="M5 17h14v-1.76a2 2 0 0 0-.44-1.24l-2.78-3.58A2 2 0 0 1 15 9.18V5a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.18a2 2 0 0 1-.78 1.58l-2.78 3.58A2 2 0 0 0 5 15.24Z"/>
                            <path d="M12 17v5"/>
                        </g>
                    </svg>
                </button>
                <button class="ctl-btn" id="btn-full" title="Full mode">
                    <svg class="ctl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 3h6v6"/>
                        <path d="M9 21H3v-6"/>
                        <path d="M21 3l-7 7"/>
                        <path d="M3 21l7-7"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="mini-tip" id="mini-tip"></div>

        <script src="../shared/audio-engine.js"></script>
        <script src="mini.js"></script>
    </body>
</html>
