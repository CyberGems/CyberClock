<!doctype html>
<html lang="en" style="background: #1e1e23;">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="../favicon.ico" />
        <title>CyberClock Menu</title>
        <link rel="stylesheet" href="../shared/themes.css" />
        <link rel="stylesheet" href="../shared/base.css" />
        <script src="../shared/tauri-bridge.js"></script>
        <script src="../shared/i18n.js"></script>
        <script src="../shared/icons.js"></script>
        <link rel="stylesheet" href="menu.css" />
    </head>
    <body style="background: #1e1e23;">
        <!-- Theme-aware gradients for the eye-candy menu icons -->
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <linearGradient
                    id="cc-grad-menu"
                    gradientUnits="userSpaceOnUse"
                    x1="2"
                    y1="2"
                    x2="22"
                    y2="22"
                >
                    <stop class="g0" offset="0" />
                    <stop class="g1" offset="1" />
                </linearGradient>
                <linearGradient
                    id="cc-grad-danger"
                    gradientUnits="userSpaceOnUse"
                    x1="2"
                    y1="2"
                    x2="22"
                    y2="22"
                >
                    <stop offset="0" stop-color="#ff6680" />
                    <stop offset="1" stop-color="#ff2d55" />
                </linearGradient>
            </defs>
        </svg>

        <div class="ctx-menu" id="ctx-menu">
            <div class="ctx-item" data-action="full">
                <span class="ico"
                    ><svg class="cc-ico-fx" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 3h6v6" />
                        <path d="M9 21H3v-6" />
                        <path d="M21 3l-7 7" />
                        <path d="M3 21l7-7" /></svg
                ></span>
                <span class="label">Full Mode</span>
            </div>
            <div class="ctx-sep"></div>
            <div class="ctx-item" data-action="timer">
                <span class="ico"
                    ><svg class="cc-ico-fx" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 2h6" />
                        <path d="M12 8a9 9 0 1 0 9 9" />
                        <path d="M17 5l-2 2" />
                        <path d="M12 12l-3 3" /></svg
                ></span>
                <span class="label">Timer</span>
            </div>
            <div class="ctx-item" data-action="stopwatch">
                <span class="ico"
                    ><svg class="cc-ico-fx" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 2h6" />
                        <path d="M12 7a9 9 0 1 0 9 9" />
                        <path d="M19 4l-2 2" />
                        <path d="M12 12l0-4" /></svg
                ></span>
                <span class="label">Stopwatch</span>
            </div>
            <div class="ctx-item" data-action="relax">
                <span class="ico"
                    ><svg class="cc-ico-fx" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 20c-4 0-7-2.5-9-6 3.5.2 6-1.2 9-4 3 2.8 5.5 4.2 9 4-2 3.5-5 6-9 6Z"
                        />
                        <path
                            d="M12 10c-1.8-2.2-2.6-4.4-2.4-6.6 1.2.8 2 .8 2.4.8s1.2 0 2.4-.8c.2 2.2-.6 4.4-2.4 6.6Z"
                        /></svg
                ></span>
                <span class="label">Relax</span>
            </div>
            
            <div class="ctx-sep"></div>
            
            <!-- SECTION: Design Mode -->
            <div class="ctx-section">
                <div class="ctx-section-title" data-i18n="settings.mini.designMode">Design Mode</div>
                <div class="design-picker" id="design-picker">
                    <button class="design-btn" data-mode="1">1</button>
                    <button class="design-btn" data-mode="2">2</button>
                    <button class="design-btn" data-mode="3">3</button>
                    <button class="design-btn" data-mode="4">4</button>
                    <button class="design-btn" data-mode="5">5</button>
                    <button class="design-btn" data-mode="6">6</button>
                    <button class="design-btn" data-mode="7">7</button>
                    <button class="design-btn" data-mode="8">8</button>
                    <button class="design-btn" data-mode="9">9</button>
                    <button class="design-btn" data-mode="10">10</button>
                    <button class="design-btn" data-mode="11">11</button>
                    <button class="design-btn" data-mode="12">12</button>
                </div>
            </div>

            <!-- SECTION: Zoom -->
            <div class="ctx-section">
                <div class="ctx-section-title" data-i18n="settings.mini.zoom">Zoom</div>
                <div class="slider-row">
                    <input type="range" id="zoom-slider" min="0" max="3" step="1" value="1" />
                    <span class="slider-val" id="zoom-val">100%</span>
                </div>
            </div>

            <!-- SECTION: Transparency -->
            <div class="ctx-section">
                <div class="ctx-section-title" data-i18n="settings.mini.bg">Background</div>
                <div class="slider-row">
                    <input type="range" id="bg-opacity-slider" min="0" max="100" value="100" />
                    <span class="slider-val" id="bg-opacity-val">100%</span>
                </div>
                <div class="ctx-section-title" data-i18n="settings.mini.content">Content</div>
                <div class="slider-row">
                    <input type="range" id="opacity-slider" min="20" max="100" value="100" />
                    <span class="slider-val" id="opacity-val">100%</span>
                </div>
            </div>

            <!-- SECTION: Collapse Date Toggle -->
            <div class="switch-row" id="ctx-collapse">
                <span class="switch-lbl">Collapse Date</span>
                <div class="toggle" id="toggle-collapse">
                    <div class="toggle-track">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>

            <!-- SECTION: Position Lock Switch -->
            <div class="switch-row" id="ctx-lock">
                <span class="switch-lbl">Position Lock</span>
                <div class="toggle" id="toggle-lock">
                    <div class="toggle-track">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>
            
            <!-- SECTION: Always on Top Toggle -->
            <div class="switch-row" id="ctx-aot">
                <span class="switch-lbl">Always on Top</span>
                <div class="toggle" id="toggle-aot">
                    <div class="toggle-track">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>

            <!-- SECTION: Real Sun Cycle (design 7 only, hidden otherwise) -->
            <div class="switch-row" id="ctx-solar" style="display: none;">
                <span class="switch-lbl">Real Sun Cycle</span>
                <div class="toggle" id="toggle-solar">
                    <div class="toggle-track">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>
            <div class="ctx-item" data-action="settings">
                <span class="ico"
                    ><svg class="cc-ico-fx" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                        />
                        <path
                            d="M19.4 15a1.9 1.9 0 0 0 .4 2.1l.1.1-1.5 2.6-.1-.1a2 2 0 0 0-2.3.8l-.1.2h-3l-.1-.2a2 2 0 0 0-1.7-1 2 2 0 0 0-1 .2l-.1.1-2.6-1.5.1-.1a1.9 1.9 0 0 0 .4-2.1l-.1-.2-2.2-1.3.1-.2a2 2 0 0 0 0-2.1l-.1-.2 2.2-1.3.1-.2a1.9 1.9 0 0 0-.4-2.1l-.1-.1 2.6-1.5.1.1a2 2 0 0 0 2.3-.8l.1-.2h3l.1.2a2 2 0 0 0 2.7.8l.1-.1 1.5 2.6-.1.1a1.9 1.9 0 0 0-.4 2.1l.1.2 2.2 1.3-.1.2a2 2 0 0 0 0 2.1l.1.2-2.2 1.3Z"
                        /></svg
                ></span>
                <span class="label">Settings</span>
            </div>
            <div class="ctx-sep"></div>
            <div class="ctx-item danger" data-action="close">
                <span class="ico"
                    ><svg class="cc-ico-fx danger" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 6 6 18" />
                        <path d="M6 6l12 12" /></svg
                ></span>
                <span class="label">Close</span>
                <span class="shortcut">Alt+F4</span>
            </div>
        </div>

        <script src="menu.js"></script>
    </body>
</html>
